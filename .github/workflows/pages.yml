name: Deploy static website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Statische Website vorbereiten
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -a "attachments (1)/." _site/

          touch _site/.nojekyll

          echo "Veröffentlichte Dateien:"
          find _site -maxdepth 3 -type f

          test -f _site/index.html

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
